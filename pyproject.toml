[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axon"
version = "0.1.0"
description = "AXON — an autonomous pentest research agent that learns by editing a knowledge graph (frozen LLM)."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "numpy>=2.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
include = ["axon*"]

[tool.pytest.ini_options]
testpaths = ["axon/tests"]
pythonpath = ["."]
addopts = "-q"
